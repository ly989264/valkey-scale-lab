# The first multi-replica configuration in this repository.
#
# Ten shards of four replicas, 50 nodes, Docker, on the workstation. Stage MR-2
# of docs/multi_replica_support_map.md §8: the candidate shape whose control is
# scale_50.yaml's 25x1 at the same 50 nodes.
#
# Identical to scale_50.yaml except for the three lines that carry the shape:
# cluster.shards 25 -> 10, cluster.replicas_per_shard 1 -> 4, and
# runtime.nodehosts_per_az 2 (the global default, absent there) -> 4. Everything
# else - safety, image, hosts, AZs, port_base, the whole workload block - is
# copied so that the replica count is the only variable between this run and its
# control. Aggregate offered load is therefore held constant, which by design
# doc §8.2 raises per-primary load 2.5x; that is a declared consequence
# (support map §5.6), not an oversight.
#
# nodehosts_per_az: 4 is a decision and is stated here rather than left implied.
# This shape plans clean at the shipped 2 as well, with 6 nodehosts
# (multi_replica_mr1_slice_map.md §3.4 measured it after the placement fix). 4
# is taken because it yields 8 nodehosts, which is the nodehost count MR-3's
# native 10x4-50 and 40x4-200 both land on against the 8-host gce-m3b fleet as
# provisioned - so every multi-replica rung stays diffable against every other
# in nodehost_density_plan, in each node's nodehost_id, in the fault matrix's
# targets and in the cleanup row count. The knob moves all four, which is why a
# multi-replica run is a new baseline class and is not diffable against the
# frozen one-replica baselines in those views.
schema_version: v1
profile_name: local_10x4_50
safety:
  default_max_nodes: 100
  allow_1000_nodes: false
  require_sandbox_network: true
  forbid_host_network_mutation: true
  cleanup_on_error: true
runtime:
  provider: docker
  valkey_image: valkey-scale-lab/valkey:9.1.0-myslots
  sandbox_mode: container_namespace
  nodehosts_per_az: 4
hosts:
  - host_id: local
    os: auto
    arch: auto
    ip: 127.0.0.1
    docker_endpoint: local
    memory_gb: auto
    disk_gb: auto
    labels: [controller, worker]
network:
  virtual_az_mode: multi
  azs: [az-a, az-b]
cluster:
  shards: 10
  replicas_per_shard: 4
  port_base: 7400
  cluster_bus_port_base: 17400
workload:
  enabled: true
  read_ratio: 0.8
  write_ratio: 0.2
  uniform_qps: 800
  hotspot_qps: 150
  hotspot_key_fraction: 0.01
  pipeline: 8
  timing: all_run
faults: []
