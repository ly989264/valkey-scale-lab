schema_version: v1
# M4's target shape, and the fourth named bounded exception in this repository.
#
# 256 shards x 4 replicas = 1280 nodes, on **the operator's own fleet, at any
# provider**. `docs/real_execution_above_200_exception_memo.md` is why this file
# exists and what it is allowed to relax; read it before changing any line of
# the safety or scale_profile blocks, and `docs/fleet_operator_runbook.md` for
# how to point it at a fleet.
#
# Three lines below are the operator's and nothing else is:
# `host_inventory_path`, `native_bundle_dir`, and `nodehosts_per_az`. None of
# them is a clause of the guard, so setting them to a fleet you actually have
# does not weaken the exception and does not need a code change - which is worth
# saying explicitly, because the guard's whole design invites the opposite
# assumption.
#
# `profile_name` is the whole of the guard. `is_exact_1280_native_ecs_profile`
# keys on this exact string plus eleven other clauses, and every one of them has
# to hold before a single validation error is waived. Renaming it, or copying
# this file and editing the node count, produces a configuration that is refused
# - which is the point of a *named* exception rather than a raised cap.
profile_name: scale_1280_native_ecs_optin
safety:
  # Unchanged from every other configuration: the development cap stays 100 and
  # this exception does not raise it. `allow_1000_nodes` stays false on purpose -
  # that opt-in is a dry-run mechanism and this exception must not be reachable
  # through it.
  default_max_nodes: 100
  allow_1000_nodes: false
  require_sandbox_network: true
  forbid_host_network_mutation: true
  cleanup_on_error: true
runtime:
  # The mirror of exact-2000's `docker`: that exception is local-only by
  # construction and this one is fleet-only, so neither can serve the other's
  # environment.
  provider: ecs
  valkey_image: valkey-scale-lab/valkey:9.1.0-myslots
  sandbox_mode: container_namespace
  # Required to be present and false by the exception itself.
  dry_run: false
  # Yours. `scripts/make_fleet_manifest.py` writes it; the fleet id in the path
  # is the one you pass that script and nothing cross-checks it against any
  # machine.
  host_inventory_path: artifacts/host-fleets/m4-fleet/inventory.json
  # Yours, and it must match the fleet's architecture rather than this name.
  # `scripts/build_native_bundle.py` takes the architecture from the pinned image
  # it reads, so building it on a host of the fleet's own architecture produces
  # the bundle that fleet can run - and `ecs_host_verify.sh --bundle DIR` is what
  # says whether this fleet's hosts can actually execute it, which is a better
  # question than any glibc version floor.
  native_bundle_dir: artifacts/native-bundles/valkey-9.1.0-memtier-2.5.1-arm64
  # Sixteen nodehosts per AZ, thirty-two hosts, one nodehost per host - which is
  # what a native run places and refuses otherwise. The number is derived, not
  # inherited: 1280 nodes at the 40 per host that 8 vCPU / 16 GB carries is 32
  # hosts, and `m4_density_calibration.md` §4 measured 50 valkey-servers per vCPU
  # clean, which 40 on 8 vCPU sits well inside.
  #
  # **Sixteen also avoids a trap, and 24 hosts is the one that looks safest.**
  # An AZ nodehost count divisible by three used to cluster every primary onto a
  # third of the nodehosts - fixed at 59fbab5a, so a divisible count now costs
  # nothing, but a fleet rebuilt at 12 or 24 hosts before that commit is a
  # different machine from one rebuilt after it.
  #
  # A 1280-node cluster is proven to form and stay healthy on 32 x (8 vCPU /
  # 16 GB). The wall the earlier attempts hit was 107 nodes on 2 vCPU, which is
  # not this shape.
  max_nodehosts: 64
  nodehosts_per_az: 16
  # 40, matching the derivation above, and the same number to pass
  # `ecs_host_verify.sh --nodes-per-host`. It was 107 because that is what twelve
  # 2-vCPU hosts had to hold; 107 was the OOM wall those runs found, never a
  # target, and leaving it here would let a mis-sized fleet compile a plan it
  # cannot run.
  max_logical_nodes_per_nodehost: 40
hosts:
  - host_id: local
    os: auto
    arch: auto
    ip: 127.0.0.1
    docker_endpoint: local
    memory_gb: auto
    disk_gb: auto
    labels: [controller, worker]
network:
  virtual_az_mode: multi
  azs: [az-a, az-b]
cluster:
  # Scaled with the cluster, and measured rather than guessed.
  #
  # A node must ping any peer it has not heard from within `node_timeout/2`, so
  # the forced heartbeat rate is (N-1)/(timeout/2) and gossip cost per node grows
  # as N x message-size, i.e. N^2. Measured on local Docker 2026-08-18, bytes/s
  # of cluster bus sent per node: 5,920 at N=50, 8,567 at N=100 and 30,915 at
  # N=200 - nearly flat to 100, then a 3.6x jump, because below ~150 peers the
  # random cron ping keeps everyone fresh and above it the forced rule binds.
  #
  # At N=1280 the forced rule dominates and 30000 puts a node at ~537 KB/s sent,
  # ~44 MB/s per 40-node host, ~5.5 MB/s per vCPU - roughly 5x the per-core
  # budget the only published 2000-node cluster ran on (valkey.io 1B RPS: one
  # node per r7g.2xlarge with SIX dedicated cores).
  #
  # The two N=200 timeout points decompose the cost: 30% is timeout-independent
  # random pinging and 70% is the forced rule, which is why 4x the timeout buys
  # only 2.1x at N=200, and more at N=1280 where the forced share is larger.
  # Extrapolated: 60000 is 1.9x cheaper (~2.9 MB/s per vCPU), 120000 is 3.4x.
  #
  # **60000 and not 120000, and that ceiling was measured rather than chosen.**
  # PFAIL detection - and therefore failover RTO - scales with this, and the
  # Sentinel canary recovery deadline is a hardcoded 180s
  # (`docker_runtime.py:9281`). Two real Docker exact-50 runs, 2026-08-18:
  # **120000 FAILS** the fault lane, 1696 canary rounds with zero reads on the
  # killed shard, because RTO would land near 190s; **60000 PASSES** with
  # `cluster_recovery_latency_ms` **95,230 ms** against ~47,000 at 30000, fault
  # lane 9/9 REAL_PASS. So 60000 is the largest value that leaves the deadline
  # untouched, and taking more gossip relief means changing a fault-lane
  # contract, not a config.
  #
  # Its cost still belongs to whoever reads a result taken here: this
  # repository's 45-50s RTO band does not apply to a run using this file.
  cluster_node_timeout_ms: 60000
  shards: 256
  replicas_per_shard: 4
  port_base: 7800
  cluster_bus_port_base: 17800
  # 64, the same as every run to date, so that node count and shard shape are the
  # only things that move underneath M4's headline result. At 40 nodes a host
  # that is 2560 MiB of dataset cap against 16 GB.
  #
  # It is a dataset cap and does not bound the process: a node holds per-peer bus
  # buffers, so RSS grows with the *fleet* rather than with this number - 10.5 MB
  # steady per node at 200 nodes against peaks of 52-110 MB at 1280. Sizing a
  # host from this line alone underestimates it by an order of magnitude.
  node_memory_limit_mb: 64
scale_profile:
  exact_1280_native_ecs_opt_in: true
  target_nodes: 1280
  execution_mode: operator_opt_in
workload:
  enabled: true
  read_ratio: 0.8
  write_ratio: 0.2
  uniform_qps: 50
  hotspot_qps: 10
  hotspot_key_fraction: 0.01
  pipeline: 1
  timing: all_run
faults: []
