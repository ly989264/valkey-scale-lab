schema_version: v1
# M4's target shape, and the fourth named bounded exception in this repository.
#
# 256 shards x 4 replicas = 1280 nodes, on the eight `c4a-standard-2` hosts of
# `gce-m3b`. `docs/real_execution_above_200_exception_memo.md` is why this file
# exists and what it is allowed to relax; read it before changing any line of
# the safety or scale_profile blocks.
#
# `profile_name` is the whole of the guard. `is_exact_1280_native_ecs_profile`
# keys on this exact string plus eleven other clauses, and every one of them has
# to hold before a single validation error is waived. Renaming it, or copying
# this file and editing the node count, produces a configuration that is refused
# - which is the point of a *named* exception rather than a raised cap.
profile_name: scale_1280_native_ecs_optin
safety:
  # Unchanged from every other configuration: the development cap stays 100 and
  # this exception does not raise it. `allow_1000_nodes` stays false on purpose -
  # that opt-in is a dry-run mechanism and this exception must not be reachable
  # through it.
  default_max_nodes: 100
  allow_1000_nodes: false
  require_sandbox_network: true
  forbid_host_network_mutation: true
  cleanup_on_error: true
runtime:
  # The mirror of exact-2000's `docker`: that exception is local-only by
  # construction and this one is fleet-only, so neither can serve the other's
  # environment.
  provider: ecs
  valkey_image: valkey-scale-lab/valkey:9.1.0-myslots
  sandbox_mode: container_namespace
  # Required to be present and false by the exception itself.
  dry_run: false
  host_inventory_path: artifacts/host-fleets/gce-m3b/inventory.json
  native_bundle_dir: artifacts/native-bundles/valkey-9.1.0-memtier-2.5.1-arm64
  # Twelve nodehosts over two AZs, one nodehost per host, which is what a
  # native run places and refuses otherwise. The fleet was rebuilt to twelve
  # `c4a-standard-2` on 2026-08-17 precisely so this number could be twelve: at
  # eight it was 160 nodes per host, or 80 valkey-servers per vCPU, against the
  # 50 per vCPU `m4_density_calibration.md` §4 measured clean. Twelve puts it at
  # 53.5, inside the measured regime, and it is what the C4A CPU quota pays for.
  max_nodehosts: 64
  nodehosts_per_az: 6
  max_logical_nodes_per_nodehost: 107
hosts:
  - host_id: local
    os: auto
    arch: auto
    ip: 127.0.0.1
    docker_endpoint: local
    memory_gb: auto
    disk_gb: auto
    labels: [controller, worker]
network:
  virtual_az_mode: multi
  azs: [az-a, az-b]
cluster:
  shards: 256
  replicas_per_shard: 4
  port_base: 7800
  cluster_bus_port_base: 17800
  # 64, the same as every run to date - which is the second reason the fleet was
  # rebuilt to twelve hosts. At eight this had to drop to 32 (160 x 64 MiB is
  # 10240 MiB against 7900 of RAM) and that would have been a second changed
  # variable underneath M4's headline result. At twelve, 107 x 64 MiB is
  # 6848 MiB and the memory model is the one every prior measurement was taken
  # under, so node count and shard shape are the only things that move.
  node_memory_limit_mb: 64
scale_profile:
  exact_1280_native_ecs_opt_in: true
  target_nodes: 1280
  execution_mode: operator_opt_in
workload:
  enabled: true
  read_ratio: 0.8
  write_ratio: 0.2
  uniform_qps: 50
  hotspot_qps: 10
  hotspot_key_fraction: 0.01
  pipeline: 1
  timing: all_run
faults: []
