schema_version: v1
profile_name: scale_1000_dryrun_optin
safety:
  default_max_nodes: 100
  allow_1000_nodes: true
  require_1000_env: VSLAB_ALLOW_1000_DRYRUN
  require_sandbox_network: true
  forbid_host_network_mutation: true
  cleanup_on_error: true
runtime:
  provider: docker
  valkey_image: valkey-scale-lab/valkey:9.1.0-myslots
  sandbox_mode: container_namespace
  dry_run: true
hosts:
  - host_id: local
    os: auto
    arch: auto
    ip: 127.0.0.1
    docker_endpoint: local
    memory_gb: auto
    disk_gb: auto
    labels: [controller, worker]
network:
  virtual_az_mode: multi
  azs: [az-a, az-b]
cluster:
  shards: 500
  replicas_per_shard: 1
  port_base: 9000
  cluster_bus_port_base: 19000
scale_profile:
  opt_in_1000: true
  dry_run_only: true
workload:
  enabled: false
faults: []
