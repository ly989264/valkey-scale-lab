  # --- Observation and analysis ---

  - id: resource-timeline-correlation-compares-unrelated-clocks
    group: "Observation and analysis"
    statement: "The resource-to-timeline correlation compares two unrelated monotonic clocks, so a run's `network_error_or_drop_overlap_count: 0` means no overlap is *expressible*, not that none was observed."
    cost_class: docker-exact-50
    selectable: true
    sites:
      - project/src/valkey_scale_lab/observability/resources.py:456
      - project/src/valkey_scale_lab/observability/resources.py:434
      - project/src/valkey_scale_lab/observability/resources.py:783
    design_doc: "docs/scalable_cluster_observability_design.md §11.4"
    cost_class_reason: "Making the two clocks comparable needs a real sampler running in a nodehost beside a real timeline, which is an exact-50 run."
    notes: "Confirmed. `_event_overlaps` (resources.py:456) compares a timeline event's `monotonic` (read by `_timeline_monotonic`, resources.py:434) against sample-window bounds produced by the sampler's own `time.monotonic`, and the sampler runs as a separate agent process inside a nodehost. §11.4 requires network errors and drops to have their overlap with the fault timeline as their analysis consumer, so the field cannot simply be dropped."

  - id: health-gate-escalation-inverts-with-scale
    group: "Observation and analysis"
    statement: "**Why the rolling-restart health-gate escalation inverts with scale** is unexplained: it fires at exact-30 and exact-50 and never at exact-200, where more nodes should mean more chances to find something unhealthy."
    cost_class: docker-exact-50
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:12542
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:12605
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:12637
    design_doc: "docs/scalable_cluster_observability_design.md §16 item 1, §14"
    cost_class_reason: "Seeing the inversion needs both an exact-30 or exact-50 run and an exact-200 one; exact-50 is the entry cost and exact-200 is what the explanation has to be checked against."
    notes: "Site confirmed: `_management_matrix_wait_rolling_restart_health` (docker_runtime.py:12542), whose in-loop whole-fleet diagnostic is rate-limited at :12605 and whose decisive final reading is at :12626. The rate limit is why an escalation is now cheap; why it fires at small scale and not at exact-200 is what is unexplained."

