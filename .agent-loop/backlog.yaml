  - id: process-runtime-state-call-site-is-unreached-by-the-suite
    group: "Observation and analysis"
    statement: "The 92/92 suite does not reach `_process_runtime_state`'s call site with its real signature: a wrong keyword there passed the whole hermetic suite and was caught by three real runs in ten seconds each."
    cost_class: hermetic
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/lifecycle.py:324
      - project/src/valkey_scale_lab/runtime/lifecycle.py:380
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:2255
    design_doc: "none in the observability design; the binding rule is CLAUDE.md \"Working rules\", run the mutation check"
    probe: |
