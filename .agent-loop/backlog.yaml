  # --- Reporting and evidence ---

  - id: report-run-id-identical-in-every-run
    group: "Reporting and evidence"
    statement: "The report's `run_id` is configuration-derived and **identical in every run**, so two reports cannot be told apart by it - only `artifact_root` distinguishes them. Changing it moves a field every frozen baseline carries."
    cost_class: docker-exact-50
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:13716
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:118
      - project/src/valkey_scale_lab/analysis/summary.py:161
      - project/src/valkey_scale_lab/report/full_flow.py:395
    design_doc: "docs/scalable_cluster_observability_design.md §17"
    cost_class_reason: "The value is a field of analysis_summary.json, which both frozen Docker baselines carry, so a change has to be re-proved by an exact-50 run and a delta-shape diff."
    notes: "Confirmed against source and evidence. `_run_id` returns f\"{capability_id}-{scenario}-{RUN_DATE}\" with RUN_DATE frozen at \"20260628\", and both frozen exact-50 runs carry run_id `local_full_flow-local_full_flow-20260628` in analysis_summary.json. The report falls back to a second hardcoded constant, report/render.py:15, when no analysis run_id is present. Changing it is a protected-path change under ROADMAP §3 critical point 2."

  - id: analysis-retry-counters-see-only-the-command-audit
    group: "Reporting and evidence"
    statement: "The analysis summary's retry counters derive from `retry_index` over `command_log.jsonl` - the command *audit* - so a management or fault re-issue is **invisible** to them."
    cost_class: docker-exact-50
    selectable: true
    sites:
      - project/src/valkey_scale_lab/analysis/summary.py:761
      - project/src/valkey_scale_lab/runtime/command_recorder.py:229
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:7542
    design_doc: "docs/scalable_cluster_observability_design.md §13"
    cost_class_reason: "The counters are fields of analysis_summary.json and the rows they read come from a real management run, so the change is only observable on an exact-50 run with a delta-shape diff."
    notes: "Refinement, not a contradiction. The management mutation chokepoint does record a re-issue, as `attempt_count` inside the existing row (docker_runtime.py:7542) rather than as an extra row, deliberately, so that `fault_command_log`'s pinned twelve rows do not move. The counters at summary.py:761 read only `retry_index` and `status == \"RETRY\"`, so the fix may be a reader change rather than a producer change."

  - id: evidence-parity-observation-volume-and-ssh-audit
    group: "Reporting and evidence"
    statement: "Neither backend records its observation volume in its own evidence, and a native run's command audit records **no ssh at all**, which is an evidence-parity gap between two backends meant to be comparable."
    cost_class: needs-fleet
    selectable: false
    sites:
      - project/src/valkey_scale_lab/runtime/native_backend.py:444
      - project/src/valkey_scale_lab/runtime/host_transport.py:207
      - project/src/valkey_scale_lab/management_matrix.py:388
    design_doc: "docs/scalable_cluster_observability_design.md §15, §16 item 15"
    cost_class_reason: "The artifact that has to change is a native run's command audit, and there is no native run without hosts. The 32-host fleet is suspended."
    notes: "Confirmed by reading source: native_backend.py contains no reference to command_log at all, and `_record` (native_backend.py:444) carries the remote argv rather than the ssh invocation that carried it, so the transport never appears in the audit. Neither backend records how many observation commands it issued."

  - id: run-evidence-records-no-kernel-socket-memory
    group: "Reporting and evidence"
    statement: "Nothing in a run's evidence records process RSS or kernel socket memory, which is why every measurement of the 1280-node wall came from outside the product."
    cost_class: docker-exact-50
    selectable: true
    sites:
      - project/src/valkey_scale_lab/observability/resources.py:244
      - project/scripts/mesh_cost_sampler.sh:20
      - project/scripts/ecs_host_verify.sh:560
    design_doc: "docs/scalable_cluster_observability_design.md §11.3, §11.4"
    cost_class_reason: "A host sampler already runs on a Docker run, so adding a socket-memory field and its analysis consumer is provable at exact-50; it changes scalable_stability_observation.json, which the frozen baselines carry."
    notes: "CLAUDE.md no longer matches source on half of this statement, and neither is edited here. **Process RSS is recorded**: resources.py:244 collects per-process `rss_bytes`, §11.3 requires it, and the frozen exact-50 baseline carries `resource_analyses[].analysis.processes.<logical_id>.rss_bytes_max` and `process_totals.rss_bytes_max_sum` in scalable_stability_observation.json. **Kernel socket memory is genuinely absent**: `sockstat` and `tcp_mem` appear only in scripts/mesh_cost_sampler.sh and scripts/ecs_host_verify.sh, which are outside the product's evidence, which is what \"came from outside the product\" describes."

  - id: failing-run-collects-no-journals-or-timeline
    group: "Reporting and evidence"
    statement: "A failing run collects **no node journals** and writes no lifecycle timeline. The failures it would help most are cluster-formation ones, which is the class M4 produces."
    cost_class: docker-exact-50
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/lifecycle.py:462
      - project/src/valkey_scale_lab/runtime/lifecycle.py:474
      - project/src/valkey_scale_lab/gates/real.py:880
    design_doc: "docs/scalable_cluster_observability_design.md §12.1, §13 items 3-4"
    cost_class_reason: "A Docker exact-30 or exact-50 run can be made to fail on purpose, which is the cheapest vehicle that reaches the failure path; the class it matters for is fleet formation failure, which cannot be reached without hosts."
    notes: "Confirmed. `_write_host_evidence` is the last statement of the success path at lifecycle.py:462; the `except Exception` at lifecycle.py:474 re-raises after `reclaim_run` and collects nothing. Its own docstring states the gap and points at cross_host_evidence_slice_map.md §10.2. `lifecycle_timeline.json` is written by gates/real.py:880 with a hardcoded `\"status\": \"PASS\"` after the run completes."

  - id: actuator-record-keeps-no-signalled-count
    group: "Reporting and evidence"
    statement: "No run can answer whether the fault actuator signalled anything: the record keeps the action string, not the `signalled` count."
    cost_class: needs-fleet
    selectable: false
    sites:
      - project/src/valkey_scale_lab/runtime/native_backend.py:1116
      - project/src/valkey_scale_lab/runtime/native_backend.py:1126
      - project/src/valkey_scale_lab/runtime/native_backend.py:472
    design_doc: "docs/scalable_cluster_observability_design.md §9.1"
    cost_class_reason: "The count exists only on the native actuator's whole-host signal path, which needs hosts. The Docker sibling pauses a cgroup and has no count to keep."
    notes: "Confirmed with one refinement. `_signal_run_processes` builds a script that prints its `signalled` count (native_backend.py:1116-1127) and `_fault_record` (native_backend.py:472) keeps `action` and `result` as strings; the count therefore survives only as untyped text inside `stdout_tail`, never as a field a reader can consume."

  # --- Retry and classification ---

  - id: retry-read-catches-a-broad-exception
    group: "Retry and classification"
    statement: "`_retry_read` still catches a broad `except Exception`, so it retries error replies - now inconsistent with the mutation chokepoint beside it, which makes the distinction."
    cost_class: hermetic
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:3625
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:7509
    design_doc: "docs/scalable_cluster_observability_design.md §13"
    probe: |
      PYTHONPATH=src python3 - <<'EOF'
      from valkey_scale_lab.runtime.docker_runtime import _retry_read, DockerRuntimeError
      from valkey_scale_lab.valkey.resp import RespCommandError
      calls = []
      def error_reply():
          calls.append(1)
          raise RespCommandError('ERR unknown command')
      try:
          _retry_read(error_reply, what='probe', attempts=3, pause=0)
      except DockerRuntimeError:
          pass
      assert len(calls) == 1, f'an error reply was retried: {len(calls)} calls'
      EOF
    proof: "A test in tests/integration/test_docker_runtime_contract.py that hands `_retry_read` a callable raising `RespCommandError` and asserts one call, and one raising `socket.timeout` and asserts three; the mutation check reverts the narrowing to `is_transient_transport_error` and watches the first assertion fail."
    cost_class_reason: "`_retry_read` takes a callable, so a test can hand it one that raises an error reply and one that raises a transport failure without any runtime."
    notes: "Confirmed. `_retry_read` (docker_runtime.py:3613) catches bare `except Exception` at :3622 and retries anything; the mutation chokepoint beside it calls `is_transient_transport_error` at docker_runtime.py:7509 and re-issues only a transport failure."

  - id: ssh-failure-is-not-classified-in-the-transport
    group: "Retry and classification"
    statement: "`HostTransport.run` returns every ssh failure as `CommandResult` rc 255, including an unreachable host, so a transport failure is not classified there."
    cost_class: hermetic
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/host_transport.py:207
      - project/src/valkey_scale_lab/runtime/host_transport.py:228
    design_doc: "docs/scalable_cluster_observability_design.md §13, §15"
    probe: |
      PYTHONPATH=src python3 - <<'EOF'
      import subprocess
      from valkey_scale_lab.runtime import host_transport
      from valkey_scale_lab.runtime.host_transport import MultiplexedSshTransport, TransportError
      def unreachable(argv, **kwargs):
          return subprocess.CompletedProcess(argv, 255, '', 'ssh: connect to host 10.0.0.1 port 22: No route to host')
      host_transport.subprocess.run = unreachable
      endpoint = {'user': 'root', 'address': '10.0.0.1', 'port': 22, 'private_key_path': '/dev/null', 'known_hosts_path': '/dev/null'}
      transport = MultiplexedSshTransport()
      try:
          result = transport.run(endpoint, ['true'], timeout=5)
      except TransportError:
          raise SystemExit(0)
      finally:
          transport.close()
      raise SystemExit(f'ssh failure returned as CommandResult rc {result.returncode}: {result.stderr.strip()}')
      EOF
    proof: "A test in tests/unit/test_native_backend.py that stubs `subprocess.run` with rc 255 and ssh's own `connect to host ... No route to host` on stderr and asserts `MultiplexedSshTransport.run` raises `TransportError`, beside one where a remote command exits 255 with no ssh diagnostic and asserts a `CommandResult` rc 255 is returned; the mutation check reverts the classification and watches the first fail."
    cost_class_reason: "tests/unit/test_native_backend.py already constructs `MultiplexedSshTransport` and a `FakeTransport`, so a stubbed `subprocess.run` reaches this classification without a host."
    notes: "Name mismatch worth knowing before writing a probe: `HostTransport` is the Protocol at host_transport.py:68 and declares no body. The behaviour described lives in `MultiplexedSshTransport.run`, host_transport.py:207, which returns `completed.returncode` unexamined at :228 - ssh's own 255 for an unreachable host and a remote command's 255 are the same value there. Only a timeout and an `OSError` become `TransportError`."

  - id: migrate-retry-still-raises-on-busykey
    group: "Retry and classification"
    statement: "`MIGRATE` retry meets `-BUSYKEY` in the dual-residence sub-case and still raises; `REPLACE` is issued but that reply is an answer, not a transport failure."
    cost_class: docker-exact-50
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:7911
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:7920
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:7509
    design_doc: "docs/scalable_cluster_observability_design.md §13"
    cost_class_reason: "The path is inside `management_matrix`, whose declared delta shape (6/8, +14 rows, REPLACE on every migrate row) has to be re-checked against the frozen exact-50 baseline after any change here."
    notes: "Confirmed, and the `REPLACE` half is already in source: docker_runtime.py:7920 issues MIGRATE with REPLACE on every batch, always rather than only on a retry. What remains open is the policy: an error reply is never retried at docker_runtime.py:7509, so a -BUSYKEY reply would still raise if REPLACE ever failed to prevent it."

  # --- Runtime and cleanup ---

  - id: aborted-controller-leaves-unattributable-ssh-masters
    group: "Runtime and cleanup"
    statement: "An **aborted controller's ssh masters** survive `SIGKILL` and cannot be reclaimed by anything afterwards - nothing on either side says which run a session belongs to. Bounded by `ControlPersist=600`."
    cost_class: needs-fleet
    selectable: false
    sites:
      - project/src/valkey_scale_lab/runtime/host_transport.py:132
      - project/src/valkey_scale_lab/runtime/host_transport.py:160
      - project/src/valkey_scale_lab/runtime/host_transport.py:185
    design_doc: "docs/scalable_cluster_observability_design.md §15"
    cost_class_reason: "Only a native run opens ssh masters, and only a fleet can be left holding them after a controller is killed."
    notes: "Confirmed. The control root is `mkdtemp(prefix=\"vslab-cm-\")` at host_transport.py:132 and each socket is numbered `m000`, `m001` at :160 - neither carries a run id, so nothing found afterwards on either side can say which run a session belongs to. `ControlPersist=600` at :185 is the bound."

  - id: no-fault-path-checks-ownership
    group: "Runtime and cleanup"
    statement: "**No fault path checks ownership.** Accepted by the operator 2026-08-10; the run mark on the actuator's rules records whose a rule is without making `isolate_nodehost` refuse a host that is not this run's."
    cost_class: needs-fleet
    selectable: false
    sites:
      - project/src/valkey_scale_lab/runtime/native_backend.py:35
      - project/src/valkey_scale_lab/runtime/native_backend.py:1172
      - project/src/valkey_scale_lab/runtime/native_backend.py:1207
    design_doc: "docs/scalable_cluster_observability_design.md §9.1"
    cost_class_reason: "The actuator being asked to refuse is the native one, on a host the run does not own; nothing local can stand in for that."
    notes: "Confirmed, and it is an absence the operator accepted on 2026-08-10 rather than a defect found since. native_backend.py:35-41 states it in the module docstring. `fault_rule_tag` marks the run on the rules (native_backend.py:1207) so cleanup can find them, and `isolate_nodehost` (native_backend.py:1172) still isolates whatever host it is given. Selectable stays false while it is an accepted absence, independently of the fleet."

  - id: docker-cleanup-terminates-by-stale-state-pids
    group: "Runtime and cleanup"
    statement: "The Docker backend still terminates by pids from `state.json`, which are stale by cleanup time; `docker rm -f` is the real backstop. Correct there, and the native backend was fixed instead."
    cost_class: docker-exact-50
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:2708
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:2942
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:2569
    design_doc: "docs/scalable_cluster_observability_design.md §15"
    cost_class_reason: "It is the cleanup stage of a Docker run; the frozen baselines score it 2/2 and a change has to keep that."
    notes: "Confirmed. `terminate_nodehost` inside `_release_process_run` reads `_cleanup_valid_pids(hosted_nodes)` from `state[\"nodes\"]` at docker_runtime.py:2708-2712 and signals those pids; `docker rm -f` at :2569 is what actually ends them. CLAUDE.md records this as correct-where-it-is and notes the native backend was fixed instead, so the open part is the asymmetry, not a Docker failure."

  - id: state-nodehost-drops-remote-bundle-dir
    group: "Runtime and cleanup"
    statement: "`_state_nodehost` drops `remote_bundle_dir`; nothing needs it now that the path is derived."
    cost_class: hermetic
    selectable: true
    sites:
      - project/src/valkey_scale_lab/runtime/docker_runtime.py:2224
      - project/src/valkey_scale_lab/runtime/native_backend.py:136
    design_doc: "docs/scalable_cluster_observability_design.md §17"
    cost_class_reason: "`_state_nodehost` is a pure dict transform; adding or not adding a key is decided by reading it."
    notes: "Confirmed, and it is a recorded design choice rather than a live defect. `_state_nodehost` (docker_runtime.py:2224) records eight fields plus a conditional `host_control_endpoint`; `run_bundle_glob` (native_backend.py:136) derives the bundle path from the run id instead, deliberately, so cleanup enumerates from the host rather than trusting what it was told. Adding the key back would move `state.json` in every frozen baseline for no consumer."

  - id: sampler-spec-duplicated-in-the-docker-backend
    group: "Runtime and cleanup"
    statement: "`SamplerSpec` in `node_backend.py` duplicates the Docker backend's private `_AgentSamplerSpec`."
    cost_class: docker-exact-50
    selectable: true
