# Exploration-loop backlog for valkey-scale-lab.
#
# Stage 1a of .github/exploration-loop/ROADMAP.md §6. One entry per item of
# CLAUDE.md "Where the work stands" > "What is still open", in CLAUDE.md's own
# order: 6 reporting and evidence, 3 retry and classification, 5 runtime and
# cleanup, 6 observation and analysis, 1 placement. Twenty-one, none added and
# none dropped.
#
# `statement` is CLAUDE.md's bullet verbatim, with its hard line wrapping joined
# by single spaces and nothing else changed. That join is the only normalisation,
# and it is what Stage 1b's assert_backlog_matches_claude_md.py should apply
# before comparing.
#
# `sites` are file:line at commit 66009427; lines move, the symbols named in
# `notes` do not.
#
# `cost_class` is the cheapest vehicle that can actually prove a change to the
# item, not the cost of noticing it:
#   hermetic         tests alone, no runtime
#   docker-exact-50  a real local Docker exact-50 run and a delta-shape diff
#                    against project/artifacts/baselines/exact-50-6b6f57fd/
#   needs-fleet      hosts the 32-host fleet would have supplied
#
# The fleet is SUSPENDED, so every needs-fleet entry is selectable: false. One
# hermetic entry is also selectable: false, and it says why in `notes`.
#
# Stage 1b added `probe` and `proof` to three hermetic entries. A `probe` is a
# command run from project/ that exits non-zero while the item is open; each
# was watched to exit 1 on the tree at the Stage 1b commit. `proof` names the
# test that shows it fixed. Two hermetic entries carry neither, and the Stage 1b
# record in ROADMAP.md says why. scripts/assert_backlog_matches_claude_md.py is
# the check that this file and CLAUDE.md still agree.

