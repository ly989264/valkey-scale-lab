schema_version: v1
profile_name: scale_1000_p37_dry_run
safety:
  default_max_nodes: 100
  allow_1000_nodes: true
  require_1000_env: VSLAB_ALLOW_1000_DRYRUN
  require_sandbox_network: true
  forbid_host_network_mutation: true
  cleanup_on_error: true
runtime:
  provider: docker
  valkey_image: valkey/valkey:9.1.0
  sandbox_mode: container_namespace
  dry_run: true
hosts:
  - host_id: local-a
    os: auto
    arch: auto
    ip: 127.0.0.1
    docker_endpoint: local
    memory_gb: auto
    disk_gb: auto
    labels: [controller, worker, dry-run]
  - host_id: local-b
    os: auto
    arch: auto
    ip: 127.0.0.1
    docker_endpoint: local
    memory_gb: auto
    disk_gb: auto
    labels: [worker, dry-run]
network:
  virtual_az_mode: multi
  azs: [az-a, az-b]
cluster:
  shards: 1000
  replicas_per_shard: 0
  port_base: 12000
  cluster_bus_port_base: 22000
  node_memory_limit_mb: 32
  non_ha_allowed: true
scale_profile:
  dry_run_only: true
  p37_dry_run_target: true
  target_nodes: 1000
  execution_mode: dry_run
  opt_in_1000: true
workload:
  enabled: false
faults: []
