schema_version: v1
profile_name: scale_200
safety:
  default_max_nodes: 100
  allow_1000_nodes: false
  require_sandbox_network: true
  forbid_host_network_mutation: true
  cleanup_on_error: true
runtime:
  provider: docker
  valkey_image: valkey/valkey:9.1.0
  sandbox_mode: container_namespace
  dry_run: false
hosts:
  - host_id: local
    os: auto
    arch: auto
    ip: 127.0.0.1
    docker_endpoint: local
    memory_gb: auto
    disk_gb: auto
    labels: [controller, worker]
network:
  virtual_az_mode: multi
  azs: [az-a, az-b]
cluster:
  shards: 100
  replicas_per_shard: 1
  port_base: 7800
  cluster_bus_port_base: 17800
  node_memory_limit_mb: 32
scale_profile:
  bounded_exception_phase: P21_FAILOVER_LATENCY_CURVE_200
  bounded_exception_nodes: 200
  automatic_default_cap_remains: 100
workload:
  enabled: true
  read_ratio: 0.8
  write_ratio: 0.2
  uniform_qps: 50
  hotspot_qps: 10
  hotspot_key_fraction: 0.01
  pipeline: 1
  timing: all_run
faults: []
