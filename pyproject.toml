[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valkey-scale-lab"
version = "0.0.0"
description = "Local-first Valkey scale lab harness built through Codex phases."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "UNLICENSED"}

[project.scripts]
valkey-scale-lab = "valkey_scale_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: timeout-sensitive checks that are not part of the default P13 fast feedback lane",
  "perf: performance or benchmarking checks that must be run explicitly",
]
