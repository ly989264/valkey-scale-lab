name: github-coverage-gates

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  fast-gates:
    name: fast gates / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project with test dependencies if present
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python3 -m pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then python3 -m pip install -e '.[dev]' || python3 -m pip install -e .; fi
      - name: Compile package and harness scripts
        run: python3 -m compileall -q src scripts
      - name: Harness precheck
        run: python3 scripts/codex_gate.py precheck --all
      - name: Safety scan
        run: python3 scripts/safety_scan.py
      - name: Committed artifact postcheck compatibility
        run: python3 -m pytest -q tests/ci/test_postcheck_compatibility.py
      - name: Unit and CLI contract tests
        run: python3 -m pytest -q tests/unit tests/ci/test_github_coverage_gates.py
      - name: Config and planner tests
        run: python3 -m pytest -q tests/config tests/planner
      - name: Runtime, fault, failover, and orchestration tests
        run: python3 -m pytest -q tests/integration tests/fault tests/failover tests/orchestrator
      - name: Analysis, report, stability, and scale tests
        run: python3 -m pytest -q tests/analysis tests/report tests/stability tests/scale
      - name: Loop-engineering validator
        run: python3 scripts/loop_engineering_validate.py --root artifacts/loop_engineering
      - name: Loop-engineering tests
        run: python3 -m pytest -q tests/loop_engineering tests/ci/test_loop_engineering_pack.py
      - name: Committed artifact audit
        run: python3 scripts/audit_committed_artifacts.py --out artifacts/loop_engineering/reports/audit_report.json
      - name: Committed artifact audit schema
        run: python3 scripts/validate_json_schema.py --schema schemas/artifact/audit_report.schema.json --instance artifacts/loop_engineering/reports/audit_report.json
      - name: Committed artifact audit tests
        run: python3 -m pytest -q tests/audit tests/ci/test_committed_artifact_audit_gate.py
      - name: Provenance graph
        run: python3 scripts/build_provenance_graph.py --out artifacts/loop_engineering/reports/provenance_graph.json
      - name: Provenance graph schema
        run: python3 scripts/validate_json_schema.py --schema schemas/artifact/provenance_graph.schema.json --instance artifacts/loop_engineering/reports/provenance_graph.json
      - name: Provenance graph tests
        run: python3 -m pytest -q tests/provenance tests/ci/test_provenance_graph_gate.py
      - name: Metric coverage matrix
        run: python3 scripts/build_metric_coverage_matrix.py --out-dir artifacts/loop_engineering/reports
      - name: Metric catalog schema
        run: python3 scripts/validate_json_schema.py --schema schemas/artifact/metric_catalog.schema.json --instance artifacts/loop_engineering/reports/metric_catalog.json
      - name: Coverage matrix schema
        run: python3 scripts/validate_json_schema.py --schema schemas/artifact/coverage_matrix.schema.json --instance artifacts/loop_engineering/reports/coverage_matrix.json
      - name: Metric coverage tests
        run: python3 -m pytest -q tests/metrics tests/coverage tests/ci/test_metric_coverage_gate.py
