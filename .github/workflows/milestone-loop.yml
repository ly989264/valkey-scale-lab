name: milestone-loop

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      action:
        description: Loop action
        required: true
        type: choice
        options: [start, resume]
      milestone:
        description: Product Milestone
        required: true
        type: choice
        options: [m1, m2, m3, m4]

concurrency:
  group: valkey-scale-lab-milestone-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: milestone-loop / candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    runs-on: [self-hosted, macOS, valkey-verify]
    timeout-minutes: 360
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Validate verifier environment
        run: python3 trusted/.github/milestone-loop/loop.py fingerprint --role verify
      - name: Recovery cleanup
        run: >-
          python3 trusted/.github/milestone-loop/loop.py recover
          --role verify
          --runtime-root "$RUNNER_TEMP/milestone-loop-verify"
      - name: Read trusted PR metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 trusted/.github/milestone-loop/loop.py pr-metadata
          --event "$GITHUB_EVENT_PATH"
      - name: Verify fixed baseline and Work Item Check
        id: verify
        continue-on-error: true
        env:
          MILESTONE_LOOP_BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
          MILESTONE_LOOP_HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          MILESTONE_LOOP_CHECK: ${{ steps.metadata.outputs.check }}
          MILESTONE_LOOP_CONTRACT_CHANGE: ${{ steps.metadata.outputs.contract_change }}
        run: |
          flag=()
          if [[ "$MILESTONE_LOOP_CONTRACT_CHANGE" == "true" ]]; then
            flag=(--contract-change)
          fi
          python3 trusted/.github/milestone-loop/verifier.py \
            --trusted-root trusted \
            --candidate-root candidate \
            --base-sha "$MILESTONE_LOOP_BASE_SHA" \
            --head-sha "$MILESTONE_LOOP_HEAD_SHA" \
            --check "$MILESTONE_LOOP_CHECK" \
            --pr "${{ steps.metadata.outputs.pr }}" \
            --result "$RUNNER_TEMP/milestone-loop-verification.json" \
            "${flag[@]}"
      - name: Upload bounded verifier result
        if: always() && steps.metadata.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-verification-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/milestone-loop-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish trusted Check conclusion
        if: always() && steps.metadata.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 trusted/.github/milestone-loop/loop.py publish-verification
          --pr "${{ steps.metadata.outputs.pr }}"
          --head-sha "${{ steps.metadata.outputs.head_sha }}"
          --milestone "${{ steps.metadata.outputs.milestone }}"
          --contract-change "${{ steps.metadata.outputs.contract_change }}"
          --result "$RUNNER_TEMP/milestone-loop-verification.json"
      - name: Enforce candidate admission conclusion
        if: always() && steps.metadata.outcome == 'success'
        run: test "${{ steps.verify.outcome }}" = "success"
      - name: Final cleanup
        if: always()
        run: >-
          python3 trusted/.github/milestone-loop/loop.py recover
          --role verify
          --runtime-root "$RUNNER_TEMP/milestone-loop-verify"

  after-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: [self-hosted, macOS, valkey-codex]
    timeout-minutes: 30
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Validate Codex runner environment
        run: python3 .github/milestone-loop/loop.py fingerprint --role codex
      - name: Recovery cleanup
        run: >-
          python3 .github/milestone-loop/loop.py recover
          --role codex
          --runtime-root "$RUNNER_TEMP/milestone-loop-codex"
      - name: Dispatch fresh post-merge planning round
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/milestone-loop/loop.py after-pr --event "$GITHUB_EVENT_PATH"

  coordinate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'start' || inputs.action == 'resume') &&
      (inputs.milestone == 'm1' || inputs.milestone == 'm2' || inputs.milestone == 'm3' || inputs.milestone == 'm4')
    runs-on: [self-hosted, macOS, valkey-codex]
    timeout-minutes: 120
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      status: ${{ steps.coordinate.outputs.status }}
      milestone: ${{ steps.coordinate.outputs.milestone }}
      default_sha: ${{ steps.coordinate.outputs.default_sha }}
      entrypoint: ${{ steps.coordinate.outputs.entrypoint }}
      readiness_sha256: ${{ steps.coordinate.outputs.readiness_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate fixed dispatch inputs
        run: >-
          python3 .github/milestone-loop/loop.py validate-dispatch
          --action "${{ inputs.action }}"
          --milestone "${{ inputs.milestone }}"
      - name: Validate Codex runner environment
        run: python3 .github/milestone-loop/loop.py fingerprint --role codex
      - name: Recovery cleanup
        run: >-
          python3 .github/milestone-loop/loop.py recover
          --role codex
          --runtime-root "$RUNNER_TEMP/milestone-loop-codex"
      - name: Configure deterministic GitHub push credential helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
      - name: Run one Planner or Worker coordination round
        id: coordinate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MILESTONE_LOOP_AUTO_MERGE: ${{ vars.MILESTONE_LOOP_AUTO_MERGE || 'false' }}
        run: >-
          python3 .github/milestone-loop/loop.py coordinate
          --action "${{ inputs.action }}"
          --milestone "${{ inputs.milestone }}"
          --runtime-root "$RUNNER_TEMP/milestone-loop-codex"
      - name: Final cleanup
        if: always()
        run: >-
          python3 .github/milestone-loop/loop.py recover
          --role codex
          --runtime-root "$RUNNER_TEMP/milestone-loop-codex"
      - name: Continue bounded retry or diagnostic
        if: steps.coordinate.outputs.status == 'RETRY' || steps.coordinate.outputs.status == 'DIAGNOSE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run milestone-loop.yml
          --ref "${{ github.event.repository.default_branch }}"
          -f action=start
          -f milestone="${{ inputs.milestone }}"

  milestone:
    needs: coordinate
    if: >-
      needs.coordinate.outputs.status == 'MILESTONE' &&
      needs.coordinate.outputs.entrypoint == 'milestone'
    runs-on: [self-hosted, macOS, valkey-real]
    timeout-minutes: 7200
    environment: valkey-real
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    outputs:
      status: ${{ steps.gate.outputs.status }}
      result: ${{ steps.gate.outputs.result }}
      milestone: ${{ needs.coordinate.outputs.milestone }}
      lease_sha256: ${{ steps.authorize.outputs.lease_sha256 }}
      environment_started: ${{ steps.protected_checkout.outcome }}
    steps:
      - uses: actions/checkout@v4
        id: protected_checkout
        with:
          ref: ${{ needs.coordinate.outputs.default_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Generate and consume this approved invocation Lease
        id: authorize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 .github/milestone-loop/loop.py authorize-real-invocation
          --milestone "${{ needs.coordinate.outputs.milestone }}"
          --entrypoint "${{ needs.coordinate.outputs.entrypoint }}"
          --expected-sha "${{ needs.coordinate.outputs.default_sha }}"
          --expected-readiness-sha256 "${{ needs.coordinate.outputs.readiness_sha256 }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
      - name: Recovery cleanup after authorization
        id: pre_cleanup
        continue-on-error: true
        run: >-
          python3 .github/milestone-loop/loop.py recover
          --role real
          --runtime-root "$RUNNER_TEMP/milestone-loop-real"
      - name: Run the only authoritative Milestone Gate
        id: gate
        if: always() && steps.authorize.outcome == 'success' && steps.pre_cleanup.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 .github/milestone-loop/loop.py run-milestone
          --milestone "${{ needs.coordinate.outputs.milestone }}"
          --expected-sha "${{ steps.authorize.outputs.default_sha }}"
          --expected-lease-sha256 "${{ steps.authorize.outputs.lease_sha256 }}"
      - name: Final real-resource cleanup
        id: cleanup
        if: always() && steps.authorize.outputs.lease_sha256 != ''
        continue-on-error: true
        run: >-
          python3 .github/milestone-loop/loop.py recover
          --role real
          --runtime-root "$RUNNER_TEMP/milestone-loop-real"
      - name: Upload Milestone Gate evidence
        id: evidence
        if: always() && steps.authorize.outcome == 'success' && steps.gate.outputs.artifacts != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: milestone-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gate.outputs.artifacts }}
          if-no-files-found: error
          retention-days: 30
      - name: Seal current-invocation Milestone result
        id: seal
        if: always() && steps.authorize.outputs.lease_sha256 != ''
        run: >-
          python3 .github/milestone-loop/loop.py seal-milestone-result
          --milestone "${{ needs.coordinate.outputs.milestone }}"
          --expected-sha "${{ steps.authorize.outputs.default_sha }}"
          --expected-lease-sha256 "${{ steps.authorize.outputs.lease_sha256 }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --gate-outcome "${{ steps.gate.outcome }}"
          --pre-cleanup-outcome "${{ steps.pre_cleanup.outcome }}"
          --cleanup-outcome "${{ steps.cleanup.outcome }}"
          --evidence-outcome "${{ steps.evidence.outcome }}"
          --raw-result "$RUNNER_TEMP/milestone-raw-result.json"
          --output "$RUNNER_TEMP/milestone-result.json"
      - name: Upload bounded Milestone Gate result
        if: always() && steps.authorize.outputs.lease_sha256 != ''
        uses: actions/upload-artifact@v4
        with:
          name: milestone-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/milestone-result.json
          if-no-files-found: error
          retention-days: 30

  m2-discovery:
    needs: coordinate
    if: >-
      needs.coordinate.outputs.status == 'MILESTONE' &&
      needs.coordinate.outputs.entrypoint == 'discovery'
    runs-on: [self-hosted, macOS, valkey-real]
    timeout-minutes: 7200
    environment: valkey-real
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    outputs:
      status: ${{ steps.discovery.outputs.status }}
      result: ${{ steps.discovery.outputs.result }}
      lease_sha256: ${{ steps.authorize.outputs.lease_sha256 }}
      environment_started: ${{ steps.protected_checkout.outcome }}
    steps:
      - uses: actions/checkout@v4
        id: protected_checkout
        with:
          ref: ${{ needs.coordinate.outputs.default_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Generate and consume this approved invocation Lease
        id: authorize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 .github/milestone-loop/loop.py authorize-real-invocation
          --milestone "${{ needs.coordinate.outputs.milestone }}"
          --entrypoint "${{ needs.coordinate.outputs.entrypoint }}"
          --expected-sha "${{ needs.coordinate.outputs.default_sha }}"
          --expected-readiness-sha256 "${{ needs.coordinate.outputs.readiness_sha256 }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
      - name: Recovery cleanup after authorization
        run: >-
          python3 .github/milestone-loop/loop.py recover
          --role real
          --runtime-root "$RUNNER_TEMP/milestone-loop-real"
      - name: Run authorized M2 candidate discovery
        id: discovery
        if: success() && steps.authorize.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 .github/milestone-loop/loop.py run-m2-discovery
          --expected-sha "${{ steps.authorize.outputs.default_sha }}"
          --expected-lease-sha256 "${{ steps.authorize.outputs.lease_sha256 }}"
      - name: Final real-resource cleanup
        id: cleanup
        if: always() && steps.authorize.outputs.lease_sha256 != ''
        continue-on-error: true
        run: >-
          python3 .github/milestone-loop/loop.py recover
          --role real
          --runtime-root "$RUNNER_TEMP/milestone-loop-real"
      - name: Seal current-invocation discovery result
        id: seal
        if: always()
        run: >-
          python3 .github/milestone-loop/loop.py seal-m2-discovery
          --expected-sha "${{ needs.coordinate.outputs.default_sha }}"
          --expected-lease-sha256 "${{ steps.authorize.outputs.lease_sha256 }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-outcome "${{ steps.discovery.outcome }}"
          --cleanup-outcome "${{ steps.cleanup.outcome }}"
          --raw-result "$RUNNER_TEMP/m2-discovery-raw-result.json"
          --evidence "$RUNNER_TEMP/m2-discovery-evidence"
          --output "$RUNNER_TEMP/m2-discovery-result.json"
      - name: Upload bounded M2 discovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-discovery-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-discovery-result.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload M2 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-discovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-discovery-evidence
          if-no-files-found: ignore
          retention-days: 30

  record-m2-discovery:
    needs: [coordinate, m2-discovery]
    if: >-
      always() &&
      needs.coordinate.outputs.entrypoint == 'discovery' &&
      (needs.m2-discovery.outputs.environment_started != '' ||
      needs.m2-discovery.outputs.lease_sha256 != '')
    runs-on: [self-hosted, macOS, valkey-codex]
    timeout-minutes: 30
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.coordinate.outputs.default_sha }}
          persist-credentials: false
      - name: Download bounded discovery result
        id: result
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: m2-discovery-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-discovery-result
      - name: Download current-invocation discovery evidence
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: m2-discovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-discovery-evidence
      - name: Record, diagnose, or request human action
        id: record
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 .github/milestone-loop/loop.py record-m2-discovery
          --expected-sha "${{ needs.coordinate.outputs.default_sha }}"
          --expected-lease-sha256 "${{ needs.m2-discovery.outputs.lease_sha256 }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --result "$RUNNER_TEMP/m2-discovery-result/m2-discovery-result.json"
          --evidence "$RUNNER_TEMP/m2-discovery-evidence"
      - name: Enforce trusted discovery conclusion
        if: always()
        run: test "${{ steps.record.outputs.discovery_status }}" = "PASS"

  record-milestone:
    needs: [coordinate, milestone]
    if: >-
      always() &&
      needs.coordinate.outputs.entrypoint == 'milestone' &&
      (needs.milestone.outputs.environment_started != '' ||
      needs.milestone.outputs.lease_sha256 != '')
    runs-on: [self-hosted, macOS, valkey-codex]
    timeout-minutes: 30
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.coordinate.outputs.default_sha }}
          persist-credentials: false
      - name: Download bounded Milestone result
        id: result
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: milestone-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/milestone-result
      - name: Record only the authoritative Gate conclusion
        id: record
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 .github/milestone-loop/loop.py record-milestone
          --milestone "${{ needs.coordinate.outputs.milestone }}"
          --expected-sha "${{ needs.coordinate.outputs.default_sha }}"
          --expected-lease-sha256 "${{ needs.milestone.outputs.lease_sha256 }}"
          --environment-started "${{ needs.milestone.outputs.environment_started }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --result "$RUNNER_TEMP/milestone-result/milestone-result.json"
      - name: Enforce trusted Milestone conclusion
        if: always()
        run: test "${{ steps.record.outputs.status }}" = "HUMAN_CLOSE"
