name: controller

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python3 -m pip install -r project/requirements-dev.txt
      - name: Verify controller release
        run: |
          cp controller/codex/framework_release.json "$RUNNER_TEMP/controller-framework-receipt.json"
          chmod 600 "$RUNNER_TEMP/controller-framework-receipt.json"
          CONTROLLER_FRAMEWORK_RECEIPT="$RUNNER_TEMP/controller-framework-receipt.json" \
            python3 -I -S -B controller/CONTROLLER_LAUNCH.py framework-verify
      - name: Controller core tests
        run: PYTHONPATH=controller/src python3 -m pytest -q controller/tests/framework
      - name: Product boundary and integration tests
        run: PYTHONPATH=controller/src python3 -m pytest -q controller/tests
