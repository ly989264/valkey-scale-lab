name: codex-gates

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile harness scripts
        run: python3 -m compileall -q scripts
      - name: Harness precheck
        run: python3 scripts/codex_gate.py precheck --all
      - name: Goal-loop manifest assertion
        run: python3 scripts/assert_goal_loop_stage.py --phase P15_GOAL_REBASE_HARNESS_EXTENSION
      - name: Safety scan
        run: python3 scripts/safety_scan.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project with test dependencies if present
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python3 -m pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then python3 -m pip install -e '.[dev]' || python3 -m pip install -e .; fi
      - name: Run unit tests if present
        run: |
          if [ -d tests ]; then python3 -m pytest -q tests/unit || exit 1; else echo 'tests not present yet'; fi
