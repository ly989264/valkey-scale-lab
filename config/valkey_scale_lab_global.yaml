runtime:
  server_profile: one_b_dev
  valkey:
    io_threads: 1
    io_threads_auto: false
    io_threads_max_per_node: 2
    io_threads_max_total: 256
    log_format: text
  nodehost_strategy: density_limited
  max_nodehosts: 64
  nodehosts_per_az: 2
  max_logical_nodes_per_nodehost: 25
  nodehost_distribution: round_robin_by_az
cluster:
  node_memory_limit_mb: 64
  cluster_node_timeout_ms: 30000
fault:
  cluster_node_timeout_matrix_ms: [5000, 10000, 15000, 30000, 60000]
observability:
  failover_timeline_observer:
    enabled: true
    probe_interval_ms: 250
    client_probe_interval_ms: 250
    probe_timeout_ms: 1000
    max_observer_endpoints: 32
profiles:
  correctness:
    cluster_node_timeout_ms: 30000
  failover_rto:
    cluster_node_timeout_ms: 30000
  management_safe:
    cluster_node_timeout_ms: 30000
    allow_override: true
